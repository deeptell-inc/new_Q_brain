[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qbscreen"
version = "0.2.0"
description = "Radical-pair spin dynamics as a quantum reservoir: capacity, readout routes, and the nuclear-register criterion"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Hikaru Wakaura", email = "h.wakaura@qiri.co.jp"},
    {name = "Taiki Tanimae", email = "t.tanimae@qiri.co.jp"},
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = [
    "quantum biology",
    "radical pair mechanism",
    "spin chemistry",
    "quantum reservoir computing",
    "cryptochrome",
    "CIDNP",
    "decoherence",
    "nuclear spin",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["qbscreen*"]

[tool.pytest.ini_options]
testpaths = ["qbscreen/tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
# Apple's Accelerate BLAS sets divide-by-zero / overflow / invalid flags on
# matmuls with entirely finite operands, so a clean run reported 67 RuntimeWarning
# lines that have nothing to do with this code. They are suppressed here rather
# than at the twenty-three call sites across six files that raise them, and
# test_blas_flag_artifact.py proves they are spurious --
# genuine non-finite results would still fail that test and the value tests.
filterwarnings = [
    "ignore:divide by zero encountered in matmul:RuntimeWarning",
    "ignore:overflow encountered in matmul:RuntimeWarning",
    "ignore:invalid value encountered in matmul:RuntimeWarning",
]
